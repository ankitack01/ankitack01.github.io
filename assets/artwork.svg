<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe9dd"/>
      <stop offset="1" stop-color="#d8d0c3"/>
    </linearGradient>
    <linearGradient id="wash1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30243c"/>
      <stop offset=".5" stop-color="#735a82"/>
      <stop offset="1" stop-color="#b6a0b5"/>
    </linearGradient>
    <linearGradient id="wash2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#233a38"/>
      <stop offset=".55" stop-color="#557b70"/>
      <stop offset="1" stop-color="#b7c9ae"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#15141a"/>
  <rect x="90" y="70" width="1020" height="760" rx="34" fill="url(#paper)" transform="rotate(-3 600 450)"/>

  <!-- soft gouache washes -->
  <ellipse cx="380" cy="340" rx="270" ry="210" fill="#9d6c7d" opacity=".62" filter="url(#blur)"/>
  <ellipse cx="770" cy="520" rx="330" ry="240" fill="#577a70" opacity=".58" filter="url(#blur)"/>
  <ellipse cx="640" cy="260" rx="210" ry="150" fill="#c29b68" opacity=".55" filter="url(#soft)"/>

  <!-- graphite-like botanical forms -->
  <g fill="none" stroke="#26242a" stroke-width="8" stroke-linecap="round" opacity=".78">
    <path d="M330 650 C360 500 420 390 520 275"/>
    <path d="M520 275 C465 285 420 270 380 225"/>
    <path d="M505 300 C550 270 600 230 625 180"/>
    <path d="M365 525 C305 485 260 440 240 385"/>
    <path d="M395 470 C455 445 510 410 535 355"/>
    <path d="M760 700 C735 560 720 430 760 300"/>
    <path d="M760 410 C820 380 865 335 885 280"/>
    <path d="M745 500 C690 460 650 420 630 365"/>
  </g>

  <g fill="#34313a" opacity=".8">
    <ellipse cx="372" cy="222" rx="75" ry="30" transform="rotate(25 372 222)"/>
    <ellipse cx="470" cy="274" rx="88" ry="31" transform="rotate(-12 470 274)"/>
    <ellipse cx="625" cy="180" rx="78" ry="28" transform="rotate(-35 625 180)"/>
    <ellipse cx="240" cy="385" rx="80" ry="29" transform="rotate(45 240 385)"/>
    <ellipse cx="535" cy="355" rx="85" ry="30" transform="rotate(-40 535 355)"/>
    <ellipse cx="885" cy="280" rx="82" ry="30" transform="rotate(-35 885 280)"/>
    <ellipse cx="630" cy="365" rx="75" ry="28" transform="rotate(40 630 365)"/>
  </g>

  <!-- painterly texture marks -->
  <g fill="#fff" opacity=".18">
    <circle cx="275" cy="250" r="9"/><circle cx="305" cy="280" r="5"/><circle cx="850" cy="610" r="10"/>
    <circle cx="900" cy="650" r="6"/><circle cx="540" cy="640" r="7"/><circle cx="600" cy="675" r="5"/>
  </g>

  <text x="600" y="760" text-anchor="middle" fill="#25222a" font-family="Georgia,serif" font-size="46" letter-spacing="9">GOUACHE &amp; GRAPHITE</text>
</svg>